apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: postgres
  name: aws-creds-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["aws-creds"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-creds-reader-binding
  namespace: postgres
subjects:
  - kind: ServiceAccount
    name: postgres-cluster
    namespace: postgres
roleRef:
  kind: Role
  name: aws-creds-reader
  apiGroup: rbac.authorization.k8s.io
