apiVersion: v1
kind: ConfigMap
metadata:
  name: security-configmap
  namespace: ingress-nginx
data:
  # -------------------
  # Rate Limiting
  # -------------------
  limit-req-status-code: "429"
  limit-req-zone-name: "global"
  limit-req-zone-size: "10m"
  limit-req: "20r/s"         # 20 requests per second per key
  limit-req-burst-multiplier: "5"
  limit-req-log-level: "warn"

  http-snippet: |
    # Define shared memory zone for rate limiting per IP
    limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;

    # Define shared memory zone for rate limiting per token (header key)
    limit_req_zone $http_x_api_token zone=pertoken:10m rate=10r/s;

    # Define shared memory zone for rate limiting per user ID (query param or header)
    map $arg_user_id $user_id {
      default $arg_user_id;
      "" $http_x_user_id;
    }
    limit_req_zone $user_id zone=peruser:10m rate=5r/s;

  server-snippet: |
    # Combine rate limits
    limit_req zone=perip burst=10 nodelay;
    limit_req zone=pertoken burst=5 nodelay;
    limit_req zone=peruser burst=3 nodelay;

    # Caching static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg|eot)$ {
      expires 30d;
      add_header Cache-Control "public, no-transform";
      access_log off;
    }

    # Security Headers
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Static content cache key map
    proxy_cache STATIC;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 302 10m;
    proxy_cache_valid 404 1m;

  # -------------------
  # Enable ModSecurity with OWASP CRS
  # -------------------
  enable-modsecurity: "true"
  enable-owasp-modsecurity-crs: "true"
  modsecurity-snippet: |
    SecRuleEngine On
    SecRequestBodyAccess On

  # Attach custom security headers config from another ConfigMap if needed
  add-headers: "ingress-nginx/custom-headers"
