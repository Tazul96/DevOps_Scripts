apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: "redis"
  replicas: 2
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: redis-node
                    operator: In
                    values:
                      - "true"
      containers:
        - name: redis
          image: redis:7.4
          command:
            - sh
            - -c
            - |
              if [ "$(hostname)" = "redis-0" ]; then
                echo "Starting as master"
                rm -f /data/replicaof.conf /data/nodes.conf
                redis-server /etc/redis/redis.conf
              else
                echo "Starting as replica of redis-0"
                rm -f /data/replicaof.conf /data/nodes.conf
                redis-server /etc/redis/redis.conf --replicaof redis-0.redis.default.svc.cluster.local 6379
              fi

          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis/redis.conf
              subPath: redis.conf
      volumes:
        - name: redis-config
          configMap:
            name: redis-config

