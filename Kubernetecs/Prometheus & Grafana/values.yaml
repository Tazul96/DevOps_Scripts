grafana:
  fullnameOverride: grafana
  service:
    type: ClusterIP
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - monitoring.ambel.co
    tls:
      - hosts:
          - monitoring.ambel.co
        secretName: ambel.co-grafana-tls

prometheus:
  fullnameOverride: prometheus
  service:
    type: ClusterIP
  ingress:
    enabled: false
  prometheusSpec:
    externalUrl: "http://prometheus.monitoring.svc.cluster.local:9090"


---
grafana:
  enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-grafana
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-body-size: "64m"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - monitoring.ambel.co
    tls:
      - hosts:
          - monitoring.ambel.co
        secretName: ambel.co-grafana-tls
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: redis-node
                operator: In
                values:
                  - "true"

prometheus:
  service:
    type: ClusterIP
  ingress:
    enabled: false
  prometheusSpec:
    externalUrl: "http://prometheus.monitoring.svc.cluster.local:9090"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: redis-node
                  operator: In
                  values:
                    - "true"
alertmanager:
  enabled: true
  alertmanagerSpec:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: redis-node
                  operator: In
                  values:
                    - "true"


